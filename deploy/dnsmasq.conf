# DNS for the festival LAN — resolves the chat domain to the server box
# with zero internet. Install on the router (OpenWrt: /etc/dnsmasq.d/) or
# on the server box itself (then point the router's DHCP "DNS server"
# option at the server's IP).
#
# CHANGE both values:
address=/chat.example.com/192.168.1.10

# Optional hardening: answer only from the LAN interface.
# interface=br-lan
