# DNS for the festival LAN — resolves the chat domain to the server box
# with zero internet. Install on the router (OpenWrt: /etc/dnsmasq.d/) or
# on the server box itself (then point the router's DHCP "DNS server"
# option at the server's IP).
#
# CHANGE both values:
address=/chat.example.com/192.168.1.10

# Optional hardening: answer only from the LAN interface.
# interface=br-lan

# --- Optional: stop phones deciding this network is dead -------------------
#
# Every phone fetches one fixed URL on joining a Wi-Fi network to decide
# whether it "has internet". With no uplink they all fail, and iOS reacts by
# dropping the Wi-Fi indicator and moving traffic to mobile data — which
# cannot reach a box on a private address. Crewbox then sits on "Connecting"
# on a phone that is still joined to the network.
#
# Uncomment to send those checks to the box, which answers them (its probe
# responder listens on port 80; the admin panel's readiness list says
# whether it got the port). CHANGE the address to the box's IP.
#
# The trade: phones stop warning that this network has no internet, because
# as far as they can tell it now has one. That is the intent — crew here are
# talking to the box, not browsing.
#
# www.google.com and www.gstatic.com are deliberately absent: they serve
# real content too, so redirecting them breaks pages instead of fixing a
# network. Same for dns.msftncsi.com, which is a DNS probe whose expected
# answer is a specific public address.
#
# address=/captive.apple.com/192.168.1.10
# address=/connectivitycheck.gstatic.com/192.168.1.10
# address=/connectivitycheck.android.com/192.168.1.10
# address=/clients3.google.com/192.168.1.10
# address=/www.msftconnecttest.com/192.168.1.10
# address=/detectportal.firefox.com/192.168.1.10
