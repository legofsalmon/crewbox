name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Format, lint, build, unit tests
    runs-on: ubuntu-latest
    # Both jobs finish in about 90 seconds. Without a cap, a hung test or a
    # wedged runner burns GitHub's six-hour default before anyone notices —
    # and a red X after ten minutes is far more useful than a spinner all
    # afternoon.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test

  e2e:
    name: End-to-end (two-device sheet sync, chat, undo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The menu-bar item and the tray icon are the only native code in the repo,
  # and until this job existed nothing built them outside a release — so a
  # typo in either would have surfaced for the first time in the middle of
  # cutting a version.
  #
  # These run the same scripts the release build runs, deliberately. The first
  # version of this job re-implemented the csc invocation in bash and failed on
  # something the real build cannot hit: MSYS path conversion rewrote /nologo
  # into C:/Program Files/Git/nologo. A check that fails for reasons the thing
  # it checks does not have is worse than no check.
  #
  # Compiling is all this proves. Whether a menu appears, and whether Quit
  # stops the box, needs a real desktop session and a person looking at it.
  helpers:
    name: Desktop helpers compile (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS menu bar
            os: macos-latest
            run: node scripts/build-menubar.mjs build/check/CrewboxMenuBar
          - name: Windows tray
            os: windows-latest
            run: node scripts/build-tray.mjs build/check/crewbox-tray.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ${{ matrix.run }}
