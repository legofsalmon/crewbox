name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Format, lint, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
# A Playwright e2e job lands with the patch module port (Phase 3,
# docs/UNIFICATION_PLAN.md) — the suite in import/livepatch/e2e ports
# to run against the crewbox server.
