name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Format, lint, build, unit tests
    runs-on: ubuntu-latest
    # Both jobs finish in about 90 seconds. Without a cap, a hung test or a
    # wedged runner burns GitHub's six-hour default before anyone notices —
    # and a red X after ten minutes is far more useful than a spinner all
    # afternoon.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run docs:test
      - name: Docs output is fresh
        # The generated docs are committed (the site deploys with no build
        # step), so regenerating must be a no-op. -N stages untracked new
        # files so a page added without its output also fails.
        run: |
          npm run docs:build
          git add -N site
          git diff --exit-code -- site/docs site/sitemap.xml

  # The release's own smoke test, on the Linux box only. It used to run
  # nowhere but release.yml, so when the licence gate changed what a new box
  # serves at /setup, every PR stayed green and the v1.0.0 release run was
  # the first thing to notice. Same steps as the release's Linux box job,
  # minus publishing, in parallel with the jobs below. The macOS and Windows
  # boxes stay release-only: those are the expensive runners.
  box:
    name: Box binary builds and runs (Linux smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w web
      # Signed the way a release signs them (release.yml, sign-web), but with a
      # key made for this run, which no phone trusts. It rehearses everything
      # else on every pull request: the screens are ones a phone would take,
      # they were built as the version the package says, and the box embeds
      # and serves them exactly as signed.
      - name: Sign the screens with a key made for this run
        run: |
          set -euo pipefail
          key="$(openssl genpkey -algorithm ed25519)"
          version="v$(node -p "require('./package.json').version")"
          RELEASE_SIGNING_KEY="$key" node scripts/sign-web.mjs web/dist "$version"
      - run: node scripts/fetch-livekit.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LIVEKIT_VERSION: ${{ vars.LIVEKIT_VERSION }}
      - run: node scripts/build-box.mjs
      - name: Smoke-test the box
        env:
          CREWBOX_SMOKE_SIGNED: '1'
        run: ./scripts/smoke-box.sh build/box/crewbox-*

  e2e:
    name: End-to-end (two-device sheet sync, chat, undo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # The docs site's own interactive bits (lightbox, search) against the
      # same clean-URL server Vercel mimics. No box involved.
      - run: npm run docs:test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
