name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Format, lint, build, unit tests
    runs-on: ubuntu-latest
    # Both jobs finish in about 90 seconds. Without a cap, a hung test or a
    # wedged runner burns GitHub's six-hour default before anyone notices —
    # and a red X after ten minutes is far more useful than a spinner all
    # afternoon.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run docs:test
      - name: Docs output is fresh
        # The generated docs are committed (the site deploys with no build
        # step), so regenerating must be a no-op. -N stages untracked new
        # files so a page added without its output also fails.
        run: |
          npm run docs:build
          git add -N site
          git diff --exit-code -- site/docs site/sitemap.xml

  e2e:
    name: End-to-end (two-device sheet sync, chat, undo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
