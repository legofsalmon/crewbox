name: Release

# Publishes single-file box binaries for the three desktop platforms plus
# the sideloadable Android APK, attached to a GitHub release.
#
# Two ways to trigger:
#   - Push a v* tag (git tag v0.1.1 && git push origin v0.1.1), or
#   - Actions -> Release -> "Run workflow": pick the branch/tag to build and
#     type the version. The tag is created at that commit if it doesn't
#     already exist, so no local tag push is needed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. v0.1.1 (tag is created at the selected ref if absent)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: resolve
        env:
          # On a tag push there is no input; the ref name is the version.
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-$REF_NAME}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Version must look like v1.2.3 (got '$VERSION')"
            exit 1
          fi
          # An existing tag wins over target_commitish when the release is
          # created, so publishing against a tag that points somewhere else
          # would ship binaries built here beside unrelated source. Refuse.
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            EXISTING="$(git rev-parse "refs/tags/$VERSION^{commit}")"
            if [ "$EXISTING" != "$BUILD_SHA" ]; then
              echo "::error::Tag $VERSION already exists at ${EXISTING:0:12} but this run builds ${BUILD_SHA:0:12}. Move the tag, or publish a new version."
              exit 1
            fi
          fi
          echo "Publishing $VERSION from ${BUILD_SHA:0:12}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  box:
    name: Box binary (${{ matrix.os }})
    needs: validate
    strategy:
      matrix:
        # macOS is not in here: it now has its own job, which builds the
        # darwin boxes and packages the app in one go rather than handing
        # artifacts to a second ten-times-billed runner. See `mac` below.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w web
      # LiveKit publishes no macOS binary, so the darwin box compiles one from
      # source (see scripts/fetch-livekit.mjs). Pure Go, no cgo — this is what
      # Homebrew's formula does. Only macOS needs the toolchain.
      - uses: actions/setup-go@v5
        if: runner.os == 'macOS'
        with:
          go-version: stable
      # Voice ships inside the box, so the SFU is fetched here rather than
      # installed by whoever runs the box. A failure here is fatal on
      # purpose: a release binary that silently lost voice is worse than a
      # red build.
      - run: node scripts/fetch-livekit.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: node scripts/build-box.mjs
      # Start the box we just built and use it. A box can build perfectly and
      # still ship without working voice — a missing asset, an SFU that won't
      # execute on this OS — and none of that appears in a build log. This is
      # the only step that proves the release actually runs, so it gates the
      # release on every platform except Windows, where the runner has no sh.
      - name: Smoke-test the box
        if: runner.os != 'Windows'
        run: ./scripts/smoke-box.sh build/box/crewbox-*
      # Windows has no sh of its own, but its runner ships Git Bash, so the
      # same script runs there. This was non-blocking until it had passed
      # once; it has now run green on v0.6.0 and v0.6.1, so it gates the
      # release like every other platform. A Windows box that cannot start,
      # serve or reach its own voice server should stop a release, not be
      # published with a green tick beside it.
      - name: Smoke-test the box (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./scripts/smoke-box.sh build/box/crewbox-win32-x64.exe
      # The Intel Mac box, built here rather than on an Intel runner. A SEA
      # blob is architecture-independent, so it can be injected into an x64
      # Node; the embedded SFU is native, so it is recompiled for amd64 with
      # cgo on (only a Mac can do that for a darwin target).
      #
      # Soft on purpose. Everything above has already succeeded by this point,
      # and shipping Linux, Windows, Apple Silicon and the APK beats failing
      # the whole release over one architecture. A skipped Intel build shows
      # up as a missing asset, which is visible, rather than a broken one.
      - name: Cross-build the Intel Mac box
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          CREWBOX_TARGET_ARCH: x64
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LIVEKIT_REFETCH=1 node scripts/fetch-livekit.mjs
          CREWBOX_BASE_NODE="$(node scripts/fetch-node.mjs darwin x64)" \
            node scripts/build-box.mjs
          file build/box/crewbox-darwin-x64
      - uses: actions/upload-artifact@v4
        with:
          name: box-${{ matrix.os }}
          path: build/box/crewbox-*

  # macOS: build and package on one runner.
  #
  # This used to be two jobs — the matrix leg above built the darwin boxes and
  # uploaded them, then a separate job downloaded them to sign and notarise.
  # Two jobs meant two checkouts, two `npm ci`s and an artifact round trip on
  # a runner GitHub bills at ten times the Linux rate, for no parallelism
  # worth having: the second could not start until the first finished anyway.
  #
  # Merging them costs a little wall-clock (the .dmg no longer overlaps with
  # the Linux and Windows boxes) and saves roughly fifteen to twenty billable
  # minutes a release.
  mac:
    name: macOS box and app
    needs: validate
    runs-on: macos-latest
    # Compiles LiveKit from source, cross-builds the Intel box on top of that,
    # and then notarises — a round trip to Apple and the slowest step in a
    # release. Still far short of the six-hour default a wedged runner burns.
    timeout-minutes: 75
    # Only the trust step needs Apple credentials; the packaging runs either
    # way so the path is exercised on every release rather than first tried
    # on the day the certificate arrives.
    env:
      MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
      MAC_NOTARY_APPLE_ID: ${{ secrets.MAC_NOTARY_APPLE_ID }}
      MAC_NOTARY_PASSWORD: ${{ secrets.MAC_NOTARY_PASSWORD }}
      MAC_NOTARY_TEAM_ID: ${{ secrets.MAC_NOTARY_TEAM_ID }}
      # Job-level so the import step's `if:` can see it — a step's own env
      # block is not in scope for that step's own condition.
      MAC_SIGN_CERT_P12: ${{ secrets.MAC_SIGN_CERT_P12 }}
      MAC_SIGN_CERT_PASSWORD: ${{ secrets.MAC_SIGN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w web
      # LiveKit publishes no macOS binary, so the darwin box compiles one from
      # source (see scripts/fetch-livekit.mjs). Pure Go, no cgo — this is what
      # Homebrew's formula does.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Voice ships inside the box, so the SFU is fetched here rather than
      # installed by whoever runs the box. A failure here is fatal on
      # purpose: a release binary that silently lost voice is worse than a
      # red build.
      - run: node scripts/fetch-livekit.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: node scripts/build-box.mjs
      # Start the box we just built and use it. A box can build perfectly and
      # still ship without working voice — a missing asset, an SFU that won't
      # execute on this OS — and none of that appears in a build log.
      - name: Smoke-test the box
        run: ./scripts/smoke-box.sh build/box/crewbox-*
      # The Intel Mac box, built here rather than on an Intel runner. A SEA
      # blob is architecture-independent, so it can be injected into an x64
      # Node; the embedded SFU is native, so it is recompiled for amd64 with
      # cgo on (only a Mac can do that for a darwin target).
      #
      # Soft on purpose. Everything above has already succeeded by this point,
      # and shipping Linux, Windows, Apple Silicon and the APK beats failing
      # the whole release over one architecture. A skipped Intel build shows
      # up as a missing asset, which is visible, rather than a broken one.
      - name: Cross-build the Intel Mac box
        continue-on-error: true
        env:
          CREWBOX_TARGET_ARCH: x64
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LIVEKIT_REFETCH=1 node scripts/fetch-livekit.mjs
          CREWBOX_BASE_NODE="$(node scripts/fetch-node.mjs darwin x64)" \
            node scripts/build-box.mjs
          file build/box/crewbox-darwin-x64
      # The signing certificate lives in a throwaway keychain that dies with
      # the runner, so the private key never touches the default one.
      - name: Import signing certificate
        if: env.MAC_SIGN_CERT_P12 != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo "$MAC_SIGN_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MAC_SIGN_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
      # Kept from when these arrived as a downloaded artifact, which strips
      # the executable bit. They no longer make that round trip, but the
      # cross-built Intel box never gets executed on this runner, so nothing
      # else here would notice if it came out without the bit.
      - run: chmod +x build/box/crewbox-darwin-*
      # Glob rather than naming both: if the Intel cross-build was skipped,
      # this still produces a working Apple Silicon app instead of failing.
      # build-mac-app.mjs takes one binary or two.
      - run: node scripts/build-mac-app.mjs build/box/crewbox-darwin-*
      # Run the universal box from inside the built app, not just the binaries
      # that went into it. lipo has to preserve each slice's injected SEA
      # section; if it doesn't, the app can't find its own payload and this is
      # where that surfaces. Only the native slice actually executes here, so
      # this proves arm64 — the Intel slice is covered by the smoke test above.
      #
      # Resources/, not MacOS/: the bundle's executable is the menu-bar
      # wrapper now, and a GUI app with a run loop is not something a headless
      # runner can smoke-test. The box is what this check is about.
      - run: ./scripts/smoke-box.sh build/mac/Crewbox.app/Contents/Resources/crewbox-server
      # The wrapper is the thing someone double-clicks, so at least prove it
      # built for both architectures and is signed. Whether the menu appears
      # is a question only a real desktop session can answer.
      - name: The menu-bar wrapper is universal and signed
        run: |
          set -euo pipefail
          WRAPPER=build/mac/Crewbox.app/Contents/MacOS/Crewbox
          ARCHS="$(lipo -archs "$WRAPPER")"
          echo "wrapper archs: $ARCHS"
          # Assert, don't print. An earlier version of this step echoed the
          # architectures and passed regardless, so an x86_64-only wrapper —
          # an app that will not launch on an Apple Silicon Mac without
          # Rosetta — read as a green tick.
          for arch in arm64 x86_64; do
            case " $ARCHS " in
              *" $arch "*) ;;
              *) echo "::error::the menu-bar wrapper has no $arch slice (got: $ARCHS)"; exit 1 ;;
            esac
          done
          codesign --verify --strict --verbose=2 "$WRAPPER"
      # Two uploads, not one with two paths: upload-artifact roots an
      # artifact at the least common ancestor of everything in it, so
      # build/box/… and build/mac/… together would arrive as box/ and mac/
      # subdirectories and the publish job's flat asset check would reject
      # them. Separate single-path uploads keep the layout the two-job
      # version produced.
      - uses: actions/upload-artifact@v4
        with:
          name: box-macos
          path: build/box/crewbox-darwin-*
      - uses: actions/upload-artifact@v4
        with:
          name: macapp
          path: build/mac/Crewbox.dmg

  apk:
    name: Android APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:native
      - run: ./gradlew assembleDebug
        working-directory: native/android
      - run: cp native/android/app/build/outputs/apk/debug/app-debug.apk crewbox.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: crewbox.apk

  release:
    name: Publish release
    needs: [validate, box, mac, apk]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Job-level so the skip condition below can see it: a step's own env
      # block is not in scope for that step's `if:`.
      DIST_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Exactly these six, no more and no fewer.
      #
      # The jobs above upload by glob (build/box/crewbox-*), and v0.7.2 shipped
      # a stray 11 KB crewbox-tray.exe because the Windows tray helper happened
      # to be built into that directory — already embedded in the .exe, so
      # pointless on a download page and confusing beside it. A glob quietly
      # gaining a file is invisible; a missing one is worse, because it looks
      # like a successful release that simply lacks your platform.
      - name: The release has exactly the expected assets
        run: |
          set -euo pipefail
          EXPECTED="Crewbox.dmg crewbox-darwin-arm64 crewbox-darwin-x64 crewbox-linux-x64 crewbox-win32-x64.exe crewbox.apk"
          ACTUAL="$(cd artifacts && ls | sort | tr '\n' ' ' | sed 's/ $//')"
          SORTED_EXPECTED="$(echo "$EXPECTED" | tr ' ' '\n' | sort | tr '\n' ' ' | sed 's/ $//')"
          echo "assets: $ACTUAL"
          if [ "$ACTUAL" != "$SORTED_EXPECTED" ]; then
            echo "::error::Release assets are not what they should be."
            echo "  expected: $SORTED_EXPECTED"
            echo "  actual:   $ACTUAL"
            exit 1
          fi

      - name: Publish to the private repo's own releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          # Pin the tag to the commit these artifacts were built from.
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          body: |
            ## Crewbox box builds

            One file, no install: download the binary for the machine that
            will be the crew box, run it, and scan the QR it prints (or open
            `/connect` on any screen). A fresh box mints its own event PIN.

            | Platform | File |
            | --- | --- |
            | Linux x64 | `crewbox-linux-x64` |
            | Windows x64 | `crewbox-win32-x64.exe` |
            | **macOS** | **`Crewbox.dmg`** — universal, works on Intel and Apple Silicon |
            | macOS (bare binary) | `crewbox-darwin-arm64` / `crewbox-darwin-x64` |
            | Android (sideload) | `crewbox.apk` — or drop it into the box's data dir to serve it at `/crewbox.apk` |

            `Crewbox.dmg` is signed, notarised and stapled — it opens with no
            warning, and with no internet. The bare `crewbox-darwin-*` binaries
            are not signed and still need **right-click → Open**. Windows warns
            about an unsigned app: **More info → Run anyway**. On Linux:
            `chmod +x` then run.

            Voice runs inside the box — nothing else to install. For a
            dedicated festival rig (HTTPS so browsers get the mic, local
            DNS, UPS), `deploy/RUNBOOK.md` is the day-of checklist.

      # Admins download from the public crewbox-dist repo, so the source repo
      # can stay private. Same binaries, no source, no token in anyone's
      # hands but this workflow's.
      #
      # Skipped rather than failed when DIST_REPO_TOKEN is absent: a release
      # that published to the private repo is still a real release, and
      # stopping here would leave the tag created but the run red.
      - name: Publish to the public distribution repo
        if: env.DIST_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.DIST_REPO || 'legofsalmon/crewbox-dist' }}
          token: ${{ secrets.DIST_REPO_TOKEN }}
          tag_name: ${{ needs.validate.outputs.version }}
          files: artifacts/*
          body: |
            Crewbox ${{ needs.validate.outputs.version }} — download the file for the
            machine that will be the crew box, run it, and scan the QR it prints.

            | Platform | File |
            | --- | --- |
            | Linux x64 | `crewbox-linux-x64` |
            | Windows x64 | `crewbox-win32-x64.exe` |
            | **macOS** | **`Crewbox.dmg`** — universal, works on Intel and Apple Silicon |
            | macOS (bare binary) | `crewbox-darwin-arm64` / `crewbox-darwin-x64` |
            | Android | `crewbox.apk` |

            `Crewbox.dmg` is signed and notarised — it just opens. The bare
            macOS binaries and the Windows `.exe` are unsigned and warn on
            first launch. On Linux: `chmod +x` then run.
