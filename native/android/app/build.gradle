apply plugin: 'com.android.application'

// Release version, from the tag CI passes in (CREWBOX_VERSION=v1.0.0).
// versionCode must strictly increase for Android to allow an in-place
// upgrade, so it is derived from the semver: 0.10.1 -> 1001, 1.0.0 -> 10000.
// The reset to 1.0.0 keeps that rule: every 0.x release was below 10000, so a
// phone on 0.19 upgrades in place to 1.0.0. Never change this formula in a way
// that gives a later release a smaller code.
//
// A local build without the variable reads the product version from the root
// package.json, so it reports the same number the box does rather than "1.0"
// with versionCode 1 (which no phone that ever had a release can install).
def crewboxVersion = (System.getenv('CREWBOX_VERSION') ?: '').replaceFirst('^v', '')
if (!crewboxVersion) {
    def rootPackage = file('../../../package.json')
    if (rootPackage.exists()) {
        crewboxVersion = new groovy.json.JsonSlurper().parse(rootPackage).version ?: ''
    }
}
def crewboxParts = crewboxVersion.tokenize('.')
def crewboxCode = 1
if (crewboxParts.size() == 3 && crewboxParts.every { it.isInteger() }) {
    crewboxCode = crewboxParts[0].toInteger() * 10000 + crewboxParts[1].toInteger() * 100 + crewboxParts[2].toInteger()
}

android {
    namespace = "com.colmhewson.crewbox"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.colmhewson.crewbox"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode crewboxCode
        versionName crewboxVersion ?: "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
             //
             // .gz/.br: the web build writes precompressed siblings beside each
             // asset for the box's HTTP serving (scripts/compress-dist.mjs).
             // Inside the webview they are dead weight — assets load from disk,
             // no content negotiation — and worse, Android's asset merger
             // strips the .gz extension and then fails the build on the
             // "duplicate" of the original. Excluded on both counts.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.gz:!*.br'
        }
    }
    // The release keystore arrives via the environment (CI decodes it from a
    // repo secret — see docs/ANDROID_SIGNING.md). One persistent key matters
    // more than anything else here: Android only installs an update over an
    // existing app when the signatures match, so a fresh key per build means
    // every phone in the field must uninstall (losing its local data) to
    // upgrade. Without the variable, builds behave exactly as before.
    signingConfigs {
        release {
            def ksPath = System.getenv('CREWBOX_KEYSTORE')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('CREWBOX_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CREWBOX_KEY_ALIAS')
                keyPassword System.getenv('CREWBOX_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv('CREWBOX_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // WebSocket client for the background alerts service.
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    // Scanning the join poster (ScannerActivity): CameraX for the picture,
    // ZXing to read the QR on the phone. Not ML Kit, which reports its use
    // to Google with no way to turn that off.
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"
    implementation "com.google.zxing:core:3.5.4"
    // Checking the signature on a box's screens (Screens.java). Tink's own
    // Ed25519: Android's is there for any key only from Android 17. Gson is
    // Tink's, named so the version Screens reads JSON with is this one.
    implementation "com.google.crypto.tink:tink-android:1.23.0"
    implementation "com.google.code.gson:gson:2.13.2"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
