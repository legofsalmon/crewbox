name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      matrix:
        # macos-15-intel is the last GitHub-hosted Intel Mac image (macos-13
        # was retired Dec 2025 — jobs targeting it queue forever).
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix server
      - run: npm run build:sea
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: build/sea/livepatch-*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: binaries/livepatch-*
          generate_release_notes: true
          body: |
            **The festival box as a single file — no install needed.**

            Download the file for your machine, double-click it, and scan the QR
            code it shows. See [DEPLOYMENT.md](https://github.com/legofsalmon/livepatch/blob/main/DEPLOYMENT.md)
            for the on-site runbook.

            | Machine | File |
            | --- | --- |
            | Windows | `livepatch-windows-x64.exe` |
            | Mac (Apple Silicon) | `livepatch-macos-arm64` |
            | Mac (Intel) | `livepatch-macos-x64` |
            | Linux | `livepatch-linux-x64` |

            First launch: Windows SmartScreen — “More info → Run anyway”;
            macOS — right-click the file → Open (the binaries are unsigned).
